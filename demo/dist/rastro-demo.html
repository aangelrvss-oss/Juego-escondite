/* DEMO VISUAL · identidad THE OUTRUN («RUN. HIDE. STAY AHEAD.»). Paleta reducida:
   - Negro carbón: fondo. Blanco: texto, logotipo y «tú» (el máximo contraste del mapa).
   - Naranja intenso: marca, acción principal y elementos destacados. Los cazadores comparten el
     naranja (el equipo se distingue sobre todo por la forma: triángulo).
   - Cian: información secundaria del mapa (fugitivos, pistas y rastro).
   - Rojo: peligro, disputa e irreversible.
   - «Simulado», «experimental» y «pendiente» son neutros con borde discontinuo o icono, nunca otro color.
   Contraste comprobado (WCAG AA): naranja sobre carbón 6,9:1, sobre surface-2 5,7:1; texto oscuro
   sobre naranja 6,8:1; resto de textos ≥ 4,5:1 sobre bg, surface y surface-2. */
:root {
  --bg: #0a0b0d;
  --surface: #15171b;
  --surface-2: #1e2126;
  --surface-3: #2a2e35;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.18);
  --text: #f2f3f5;
  --muted: #a3a8b2;
  --faint: #8a909b;
  --brand: #ff6b1f;
  --brand-ink: #1a0900;
  --brand-soft: rgba(255, 107, 31, 0.15);
  --me: #ffffff;
  --me-soft: rgba(255, 255, 255, 0.14);
  --hunter: var(--brand);
  --hunter-soft: var(--brand-soft);
  --runner: #33c3e6;
  --runner-soft: rgba(51, 195, 230, 0.16);
  --danger: #ff5c72;
  --danger-soft: rgba(255, 92, 114, 0.14);
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 8px;
  --tap: 52px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "Roboto Mono", "SFMono-Regular", Menlo, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100%; }

/* ---------- estructura de pantalla ---------- */
.screen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
  max-width: 560px;
  margin: 0 auto;
}
.topbar { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.topbar h1 { font-size: 20px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -0.015em; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 0;
  background: var(--surface-2); display: grid; place-items: center; flex: none;
}
.icon-btn:active { background: var(--surface-3); }
.icon-btn svg { width: 22px; height: 22px; }
.spacer { flex: 1; }

/* Aviso de simulación: siempre el mismo componente. */
/* Borde discontinuo = «no es real / provisional», igual que las pistas del mapa. */
.demo-pill {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text); border: 1px dashed var(--line-strong);
  padding: 4px 10px; border-radius: var(--r-sm); white-space: nowrap;
}
.exp { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 1px 6px; }

/* ---------- botones ---------- */
.btn {
  min-height: var(--tap); padding: 12px 18px; border-radius: var(--r-md); border: 1px solid transparent;
  background: var(--surface-2); font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
  transition: transform 0.08s ease, background-color 0.12s ease;
}
.btn:active:not(:disabled) { transform: scale(0.98); background: var(--surface-3); }
.btn-primary { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.btn-primary:active:not(:disabled) { background: var(--brand); filter: brightness(0.9); }
.btn-outline { background: transparent; border-color: var(--line-strong); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-danger { background: var(--surface-2); color: var(--danger); }
.btn .dot { width: 14px; height: 14px; }
.btn-line { display: inline-flex; align-items: center; gap: 8px; }
.btn:disabled { background: var(--surface); color: var(--faint); border-color: var(--line); }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }
.btn small { font-weight: 500; opacity: 0.85; }
.link-btn { background: none; border: 0; color: var(--brand); padding: 12px 0; min-height: 44px; font-size: 15px; font-weight: 600; }

/* ---------- marca THE OUTRUN ---------- */
/* Símbolo y logotipo son vectores (ui.js): nítidos a cualquier tamaño y siempre los mismos. */
.mark { display: inline-block; flex: none; width: 1em; height: 1em; }
.mark svg { width: 100%; height: 100%; display: block; }
.mark-tile { display: inline-block; flex: none; width: 44px; height: 44px; }
.app-icon { width: 100%; height: 100%; display: block; }
.wordmark { display: block; width: 100%; height: auto; }
.logo { margin: 0; }
.lockup { display: inline-flex; align-items: center; gap: 6px; height: 20px; }
.lockup .mark { font-size: 20px; }
.lockup .wordmark { width: auto; height: 100%; }
.slogan { margin: 8px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.34em; color: #fff; text-align: center; white-space: nowrap; }
.demo-pill .mark { font-size: 14px; }

/* ---------- inicio ---------- */
.home { gap: 10px; }
.home .topbar { justify-content: space-between; min-height: 48px; }
/* Portada: franja superior oscura con el logotipo y, debajo, la imagen local (incrustada al
   compilar). El margen superior de la imagen crece en pantallas estrechas para que el lema quede
   siempre por encima de la figura (la cabeza está al ~21 % de la altura de la imagen). */
.cover { position: relative; flex: none; border-radius: var(--r-lg); overflow: hidden; background: #0d0f13; }
.cover-brand { position: absolute; z-index: 1; top: 16px; left: 18px; display: inline-grid; width: min(calc(100% - 36px), 300px); }

  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, #0d0f13 0%, rgba(13, 15, 19, 0.55) 16%, rgba(13, 15, 19, 0) 34%, rgba(13, 15, 19, 0) 70%, rgba(10, 11, 13, 0.9) 100%);

.home-text { color: var(--muted); margin: 0; font-size: 15px; }
.home-actions { display: grid; gap: 10px; margin-top: auto; }
.home-actions .btn-ghost { min-height: 44px; padding: 8px 18px; }
.home-foot { color: var(--faint); font-size: 12px; text-align: center; margin: 0; }

/* ---------- tarjetas y formularios ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; }
.card h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.card p:last-child { margin-bottom: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px; }
.seg button { flex: 1; min-height: 46px; border: 0; border-radius: var(--r-sm); background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); padding: 6px 8px; }
.seg button:active { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.mode-grid { display: grid; gap: 8px; }
.mode-card { text-align: left; border-radius: var(--r-md); border: 2px solid var(--brand); background: var(--brand-soft); padding: 12px 14px; min-height: var(--tap); }
.mode-card b { display: block; font-size: 16px; }
.mode-card span { color: var(--muted); font-size: 13px; }
.mode-card.future { border: 0; background: none; padding: 4px 2px; min-height: 44px; width: 100%; color: var(--faint); }
.mode-card.future b { font-size: 13px; font-weight: 600; display: inline; }
.mode-card.future span { display: none; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: var(--tap); height: var(--tap); border-radius: var(--r-md); border: 0; background: var(--surface-2); font-size: 26px; line-height: 1; }
.stepper button:active:not(:disabled) { background: var(--surface-3); }
.stepper button:disabled { color: var(--faint); background: var(--bg); }
.stepper output { flex: 1; text-align: center; font-size: 36px; font-weight: 800; line-height: 1.1; }
.stepper output small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.preview { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); }
.chip .dot { width: 11px; height: 11px; }
.chip.hunter { color: var(--hunter); background: var(--hunter-soft); }
.chip.runner { color: var(--runner); background: var(--runner-soft); }
details.more { background: var(--surface); border-radius: var(--r-lg); }
details.more summary { min-height: var(--tap); padding: 14px 16px; font-weight: 700; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
details.more[open] summary::after { content: "▴"; }
details.more .inner { padding: 0 16px 16px; display: grid; gap: 16px; }
.field-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); }
.switch button { width: 56px; height: 34px; border-radius: 999px; border: 0; background: var(--surface-3); position: relative; flex: none; }
.switch button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--faint); transition: transform 0.15s ease; }
.switch button[aria-checked="true"] { background: var(--brand-soft); }
.switch button[aria-checked="true"]::after { transform: translateX(22px); background: var(--brand); }
.switch button:disabled { opacity: 0.5; }
.sticky-foot { position: sticky; bottom: 0; padding: 14px 0 calc(4px + var(--safe-bottom)); background: linear-gradient(transparent, var(--bg) 26%); margin-top: auto; }

.code-input {
  width: 100%; min-height: 72px; font-size: 32px; letter-spacing: 0.3em; text-align: center; text-transform: uppercase;
  border-radius: var(--r-md); border: 2px solid var(--surface-3); background: var(--bg); padding: 8px 4px 8px 0.3em;
}
.code-input:focus { border-color: var(--brand); outline: none; }
.code-input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-soft); }
.error-text { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 1.4em; }
.error-text:empty { min-height: 0; margin: 0; }

.rules h3 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.rules ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.rules li { margin-bottom: 6px; }
.rules li:last-child { margin-bottom: 0; }
.future-note { background: none; border: 1px dashed var(--line-strong); }
.future-note h3, .future-note li { color: var(--muted); }

/* ---------- sala de espera ---------- */
.code-box { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); }
.code-box .code { font-size: 32px; font-weight: 800; letter-spacing: 0.12em; flex: 1; color: var(--text); }
.code-box .btn { min-height: 48px; padding: 8px 14px; font-size: 15px; }
.meta-line { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.quota { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quota-item { border-radius: var(--r-md); padding: 10px 12px; background: var(--surface-2); }
.quota-item .n { font-size: 28px; font-weight: 800; line-height: 1.1; }
.quota-item.hunter .n { color: var(--hunter); }
.quota-item.runner .n { color: var(--runner); }
.quota-item small { color: var(--muted); display: block; font-size: 12px; }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.player { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 60px; border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; background: var(--surface-3); color: var(--muted); }
.avatar.hunter { background: var(--hunter-soft); color: var(--hunter); }
.avatar.runner { background: var(--runner-soft); color: var(--runner); }
.player .who { flex: 1; min-width: 0; }
.player .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .who small { color: var(--muted); font-size: 12px; }
.ready { font-weight: 700; color: var(--faint); }
.ready.on { color: var(--brand); }
.team-toggle { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 2px; flex: none; }
.team-toggle button { min-width: 52px; min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 13px; color: var(--faint); padding: 0 8px; }
.team-toggle button[aria-pressed="true"].hunter { background: var(--surface-3); color: var(--hunter); }
.team-toggle button[aria-pressed="true"].runner { background: var(--surface-3); color: var(--runner); }
.team-tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; flex: none; }
.team-tag.hunter { color: var(--hunter); background: var(--hunter-soft); }
.team-tag.runner { color: var(--runner); background: var(--runner-soft); }
.team-tag.none { color: var(--faint); background: var(--surface-2); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issue { font-size: 14px; padding: 9px 12px; border-radius: var(--r-sm); display: flex; gap: 8px; border-left: 3px solid; }
.issue.error { background: var(--danger-soft); color: var(--text); border-color: var(--danger); }
.issue.warning { background: var(--surface-2); color: var(--text); border-color: var(--faint); border-left-style: dashed; }
.issue.ok { background: var(--brand-soft); color: var(--text); border-color: var(--brand); }
.foot-status { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
.foot-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.foot-status.error { color: var(--danger); }
.foot-status.ok { color: var(--brand); }
.foot-status.wait { color: var(--muted); }

/* ---------- partida ---------- */
.game { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.map-wrap { position: absolute; inset: 0; }
.map { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; }
.hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(10px + var(--safe-top)) 12px 0; display: grid; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-row { display: flex; align-items: stretch; gap: 8px; }
.glass { background: rgba(10, 11, 13, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; }
/* Fase en el reloj: espera (neutra), caza (lima = acción), resolución (rojo). Además lleva su nombre. */
.hud-card { flex: 1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-left: 4px solid var(--faint); }
.hud-card.phase-hunt { border-left-color: var(--brand); }
.hud-card.phase-resolving { border-left-color: var(--danger); }
.hud-card.phase-finished { border-left-color: var(--faint); }
.timer { display: flex; flex-direction: column; }
.timer .label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.phase-hunt .timer .label { color: var(--brand); }
.phase-resolving .timer .label { color: var(--danger); }
.timer .clock { font-size: 36px; font-weight: 800; line-height: 1.05; }
.role { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 999px; }
.role .dot { width: 13px; height: 13px; flex: none; }
.role.hunter { color: var(--hunter); background: var(--hunter-soft); }
.role.runner { color: var(--runner); background: var(--runner-soft); }
.role.spect { color: var(--muted); background: var(--surface-2); }
.hud .icon-btn { width: 52px; height: auto; min-height: 52px; border-radius: 16px; }
.status-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 12px; font-size: 12px; color: var(--muted); border-radius: 12px; }
.status-strip .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.status-strip .sim { color: var(--text); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; border: 1px dashed var(--line-strong); border-radius: 6px; padding: 1px 6px; }
.status-strip .paused { color: var(--text); font-weight: 700; }
.banner { padding: 10px 14px; font-size: 14px; font-weight: 600; margin-bottom: 8px; border-left: 4px solid var(--line-strong); }
.banner:last-child { margin-bottom: 0; }
/* Indicación del siguiente paso: neutra salvo «actúa» (lima), «cambio de zona» (blanco) y peligro o disputa (rojo, con fondo). */
.banner { font-size: 15px; }
.banner.zone { border-left-color: var(--text); }
.banner.go { border-left-color: var(--brand); }
.banner.danger { background: rgba(64, 12, 20, 0.94); border-left-color: var(--danger); }
.banner.spect { border-left-color: var(--faint); color: var(--muted); }
.banner.hint { font-weight: 500; color: var(--muted); padding: 6px 12px; font-size: 13px; display: inline-block; border-left-color: var(--faint); }
.bar { flex: 1; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--text); }

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + var(--safe-bottom)); display: grid; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock-actions { display: flex; gap: 8px; align-items: stretch; }
.dock-actions .btn { min-height: 62px; border-radius: 18px; font-size: 17px; flex-direction: column; gap: 1px; line-height: 1.15; padding: 8px 10px; }
.dock-actions .main { flex: 1.7; }
.dock-actions .side { flex: 1; }
.dock-actions small { font-size: 12px; }
.dock .btn.glass:not(:disabled) { background: rgba(30, 33, 38, 0.96); }
.dock .btn:disabled { background: rgba(10, 11, 13, 0.94); color: var(--muted); }
.dock .btn:disabled small { opacity: 1; color: var(--faint); }
.sheet { padding: 4px 12px 12px; max-height: 46dvh; display: flex; flex-direction: column; }
.sheet-handle { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; min-height: 50px; padding: 8px 2px 4px; text-align: left; }
.sheet-handle .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--faint); position: absolute; left: 50%; top: 4px; transform: translateX(-50%); }
.sheet-handle b { font-size: 15px; }
.sheet-handle span { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .tabs { display: flex; gap: 4px; margin: 4px 0 10px; background: var(--bg); border-radius: 12px; padding: 3px; }
.sheet .tabs button { flex: 1; min-height: 44px; border-radius: 10px; border: 0; background: transparent; font-weight: 600; font-size: 14px; color: var(--muted); }
.sheet .tabs button[aria-selected="true"] { background: var(--surface-3); color: var(--text); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; display: grid; grid-auto-rows: max-content; gap: 6px; padding-bottom: 4px; }
/* max-content: con altura limitada, las filas con min-height no se encogen por debajo de su contenido (si no, el texto se solapa). */
.row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px; min-height: 52px; }
.row .grow { flex: 1; min-width: 0; }
.row .grow small { display: block; color: var(--muted); font-size: 12px; }
.row.alert { background: var(--danger-soft); border-left: 3px solid var(--danger); }
.trail-key { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--runner); background: var(--runner-soft); flex: none; }
.row .btn { min-height: 44px; padding: 6px 14px; font-size: 14px; border-radius: 12px; }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 0; }
.section-label.hunter { color: var(--hunter); }
.section-label.runner { color: var(--runner); }
.state { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.state.pending { background: var(--surface-3); color: var(--text); }
.state.confirmed, .state.accepted { background: var(--brand-soft); color: var(--brand); }
.state.disputed { background: var(--danger-soft); color: var(--danger); }
.state.closed { background: var(--surface-3); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; margin: 0; }
.demo-ctrl { padding: 4px 2px; display: grid; gap: 10px; }
.demo-ctrl .seg button { min-height: 44px; }

/* ---------- capas: modal, cuenta atrás, avisos ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4, 5, 12, 0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 12px 12px calc(12px + var(--safe-bottom)); }
.modal { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: grid; gap: 14px; max-height: 90dvh; overflow-y: auto; }
.modal h2 { margin: 0; font-size: 22px; letter-spacing: -0.015em; line-height: 1.2; }
.modal p { margin: 0; color: var(--muted); }
.big-state { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-weight: 700; border-left: 4px solid var(--line-strong); }
.big-state.pending { border-left-color: var(--faint); }
.big-state.ok { border-left-color: var(--brand); color: var(--brand); }
.big-state.dispute { border-left-color: var(--danger); color: var(--danger); }
.big-state.closed { border-left-color: var(--faint); color: var(--muted); }
.disclaimer { font-size: 13px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--text); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Tarjeta de rol: se lee con el reloj parado y se cierra solo con «Entendido». */
.role-card .role { margin-left: 0; justify-self: start; }
.role-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-brand { display: inline-flex; align-items: center; flex: none; }
.role-card.hunter { border-top: 4px solid var(--hunter); }
.role-card.runner { border-top: 4px solid var(--runner); }
.role-step { display: grid; gap: 2px; }
.role-step .section-label { margin: 0; }
.role-step p { color: var(--text); font-size: 16px; }
.role-card .safety { color: var(--text); font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border-left: 4px solid var(--brand); }
.countdown { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(10, 11, 13, 0.95); pointer-events: none; padding: 24px; }
.countdown b { display: block; text-align: center; font-size: 140px; font-weight: 800; color: var(--brand); line-height: 1; }
.countdown small { display: block; text-align: center; font-size: 18px; font-weight: 600; color: var(--text); margin-top: 12px; max-width: 30ch; }
.toasts { position: fixed; left: 12px; right: 12px; bottom: calc(150px + var(--safe-bottom)); z-index: 20; display: grid; gap: 8px; pointer-events: none; justify-items: center; }
body.in-game .toasts { bottom: calc(180px + var(--safe-bottom)); }
/* Con el panel abierto, los avisos suben para no tapar lo que se está leyendo, pero quedan DEBAJO
   de los banners (--toast-top lo calcula ui.js con la altura real del HUD): nunca tapan un peligro. */
body.in-game.sheet-open .toasts { bottom: auto; top: var(--toast-top, calc(150px + var(--safe-top))); }
.toast { max-width: 480px; width: 100%; padding: 11px 14px; border-radius: var(--r-md); background: rgba(42, 46, 53, 0.97); border-left: 4px solid var(--faint); font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); animation: toast-in 0.16s ease-out; }
.toast.info { border-left-color: var(--brand); }
.toast.zone { border-left-color: var(--text); }
.toast.dispute { border-left-color: var(--danger); }
.toast.ping { border-left-color: var(--runner); }
.toast .ico { display: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

/* ---------- final ---------- */
.result-hero { border-radius: 24px; padding: 20px 18px; background: var(--surface); border-top: 4px solid var(--faint); }
.result-hero.runner { border-top-color: var(--runner); background: linear-gradient(180deg, var(--runner-soft), var(--surface) 60%); }
.result-hero.hunter { border-top-color: var(--hunter); background: linear-gradient(180deg, var(--hunter-soft), var(--surface) 60%); }
.result-hero h1 { margin: 10px 0 4px; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
.result-hero p { margin: 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: rgba(10, 11, 13, 0.5); border-radius: var(--r-md); padding: 10px; }
.stat b { display: block; font-size: 22px; }
.stat small { color: var(--muted); font-size: 12px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

/* ---------- mapa ---------- */
.mz-bg { fill: #101114; }
.st { stroke: #1b1d22; stroke-width: 7; }
.av { stroke: #24272d; stroke-width: 14; }
.mz-river { fill: none; stroke: #151a21; stroke-width: 46; }
.mz-park { fill: #18201b; }
.mz-out { fill: rgba(0, 0, 0, 0.6); }
.mz-zone { fill: rgba(242, 243, 245, 0.035); stroke: var(--text); stroke-opacity: 0.8; stroke-width: 3; }
.mz-next { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-dasharray: 8 6; }
.mz-note { fill: var(--faint); }
.mk-h { fill: var(--hunter); stroke: var(--bg); }
.mk-r { fill: var(--runner); stroke: var(--bg); }
.mk-ping { fill: var(--runner-soft); stroke: var(--runner); }
.mk-ring { fill: none; stroke: var(--runner); }
.mk-meet { fill: var(--muted); }
/* Rastro propio: la misma forma con la que los cazadores ven una pista (discontinua = no es «ahora»). */
.mk-trail { fill: var(--runner-soft); stroke: var(--runner); }
.mk-reach, .mk-scan { fill: rgba(255, 107, 31, 0.09); stroke: var(--hunter); }
.mk-route { fill: none; stroke: var(--me); }
.mk-me-halo { fill: var(--me-soft); }
.mk-me-ring { fill: var(--bg); }
.mk-me-ring.hunter { stroke: var(--hunter); }
.mk-me-ring.runner { stroke: var(--runner); }
.mk-me-core { fill: var(--me); }
.m-label { font-weight: 700; paint-order: stroke; stroke: #101114; stroke-linejoin: round; fill: var(--text); }
.m-label.me { fill: var(--me); font-weight: 800; }
.m-label.dim { fill: var(--muted); }
.m-label.hunter { fill: var(--hunter); }
.pulse { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: 0.9; transform: scale(0.6); } to { opacity: 0; transform: scale(1.8); } }
.scan-ring { animation: scan 1.2s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes scan { from { opacity: 1; transform: scale(0.2); } to { opacity: 0.3; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (max-height: 760px) {
  .timer .clock { font-size: 26px; }
}
/* Pantallas altas: la imagen completa (la figura entera, de pie). */
@media (min-height: 860px) {
  .cover-art { aspect-ratio: 640 / 620; }
}

</style>

<script>
(() => {
'use strict';
const __BUILD__ = 'build c114c89b';
const S = (() => {
// DEMO VISUAL: lógica de una partida SIMULADA del modo Clásico.
// NO es el motor validado de S0 (engine/) ni lo sustituye. No usa GPS ni red.
// Todos los valores numéricos son EXPERIMENTALES (D-038). Coordenadas en metros
// respecto al centro del mapa: el mapa no depende de ningún proveedor.

const APP_NAME = 'Rastro'; // nombre provisional, sustituible

const EXPERIMENTAL = Object.freeze({
  minPlayers: 2,
  maxPlayers: 20,
  ratios: { pocos: 1 / 5, equilibrado: 1 / 3, muchos: 1 / 2 },
  durationsMin: [10, 20, 30],
  zoneRadiiM: [250, 400, 600],
  countdownS: 3,
  headStartS: 120,
  pingEveryS: 180,
  botUpdateEveryS: 5,
  demoSpeeds: [5, 10, 30],
  defaultSpeed: 10,
  walkMps: 1.4,
  botRunnerMps: 1.2,
  botHunterMps: 1.8,
  captureRadiusM: 15,
  botTagRadiusM: 8,
  claimResponseS: 4,
  incomingTimeoutS: 30,
  botConfirmProbability: 0.75,
  disputeResolveAfterS: 60,
  reclaimCooldownS: 60,
  resolutionWindowS: 120,
  outsideGraceS: 30,
  spectatorDelayS: 60,
  scan: { uses: 2, radiusM: 100, cooldownS: 120 },
  dynamicZone: { firstChangeAt: 0.4, secondChangeAt: 0.7, shrink: 0.7, warnS: 60 },
});

/**
 * Comportamiento de los BOTS de la demo. No son reglas del juego ni parámetros de partida (D-038):
 * solo sirven para que la simulación se parezca más a una partida. No afectan al jugador.
 */
const BOT_BEHAVIOR = Object.freeze({
  relocateAfterPingProbability: 0.5, // tras una pista que le incluye, cambia de escondite (a veces)
  relocateMinM: 60, // cambio corto y controlado, siempre caminando
  relocateMaxM: 160,
});

const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

const BOT_NAMES = [
  'Lucía', 'Mateo', 'Sofía', 'Hugo', 'Martina', 'Leo', 'Valeria', 'Daniel', 'Paula', 'Álvaro',
  'Carmen', 'Pablo', 'Irene', 'Diego', 'Noa', 'Marcos', 'Elena', 'Adrián', 'Julia', 'Bruno',
];

// ------------------------------------------------------------------ utilidades

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(items, random) {
  const out = [...items];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function hashCode(text) {
  let h = 2166136261;
  for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function stepToward(from, to, meters) {
  const d = dist(from, to);
  if (d <= meters || d === 0) return { x: to.x, y: to.y };
  return { x: from.x + ((to.x - from.x) * meters) / d, y: from.y + ((to.y - from.y) * meters) / d };
}

function formatClock(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// ------------------------------------------------------------------ sala

function isValidCode(code) {
  return typeof code === 'string' && code.length === 6 && [...code].every((c) => CODE_ALPHABET.includes(c));
}

function normalizeCode(raw) {
  return String(raw ?? '').toUpperCase().replace(/\s+/g, '');
}

function codeFromSeed(seed) {
  const random = mulberry32(seed);
  let code = '';
  for (let i = 0; i < 6; i++) code += CODE_ALPHABET[Math.floor(random() * CODE_ALPHABET.length)];
  return code;
}

/** Cazadores objetivo para n jugadores (HIPÓTESIS D-031: aún por definir y probar). */
function huntersTarget(n, ratioKey) {
  const ratio = EXPERIMENTAL.ratios[ratioKey] ?? EXPERIMENTAL.ratios.equilibrado;
  return clamp(Math.round(n * ratio), 1, Math.max(1, Math.floor(n / 2)));
}

function defaultSettings() {
  return {
    players: 8,
    assignment: 'auto',
    ratio: 'equilibrado',
    durationMin: 20,
    zoneRadiusM: 400,
    dynamicZone: true,
  };
}

function buildPlayers(n, random, selfIsHost) {
  const names = shuffle(BOT_NAMES, random).slice(0, n - 1);
  const players = [{ id: 'me', name: 'Tú', isSelf: true, isHost: selfIsHost, team: null, ready: false }];
  names.forEach((name, i) => {
    players.push({ id: `b${i + 1}`, name, isSelf: false, isHost: !selfIsHost && i === 0, team: null, ready: false });
  });
  return players;
}

function createRoom(settings, seed = Date.now()) {
  const s = { ...defaultSettings(), ...settings };
  s.players = clamp(Math.round(s.players), EXPERIMENTAL.minPlayers, EXPERIMENTAL.maxPlayers);
  const random = mulberry32(seed);
  return {
    code: codeFromSeed(seed),
    seed,
    drawSeed: seed,
    drawCount: 0,
    round: 1,
    settings: s,
    players: buildPlayers(s.players, random, true),
    joined: false,
    history: [],
  };
}

function joinRoom(rawCode) {
  const code = normalizeCode(rawCode);
  if (!isValidCode(code)) {
    return { ok: false, error: 'Código no válido: deben ser 6 caracteres sin O, 0, I, 1 ni L.' };
  }
  const seed = hashCode(code);
  const random = mulberry32(seed);
  const settings = { ...defaultSettings(), players: 4 + Math.floor(random() * 7) };
  const room = createRoom(settings, seed);
  room.code = code;
  room.players = buildPlayers(settings.players, mulberry32(seed + 1), false);
  room.joined = true;
  // En una sala ajena el anfitrión simulado ya ha sorteado los equipos.
  drawTeams(room);
  return { ok: true, room };
}

function teamCounts(room) {
  const hunters = room.players.filter((p) => p.team === 'hunter').length;
  const runners = room.players.filter((p) => p.team === 'runner').length;
  return { hunters, runners, unassigned: room.players.length - hunters - runners, target: huntersTarget(room.players.length, room.settings.ratio) };
}

/** Sorteo reproducible: misma sala y mismo número de sorteo, mismo reparto. */
function drawTeams(room) {
  room.drawCount++;
  const random = mulberry32(room.drawSeed + room.drawCount * 7919);
  const order = shuffle(room.players.map((p) => p.id), random);
  const k = huntersTarget(room.players.length, room.settings.ratio);
  for (const p of room.players) p.team = order.indexOf(p.id) < k ? 'hunter' : 'runner';
  return room;
}

function setTeam(room, playerId, team) {
  const p = room.players.find((x) => x.id === playerId);
  if (!p || !['hunter', 'runner'].includes(team)) return false;
  p.team = team;
  return true;
}

function setReady(room, playerId, ready) {
  const p = room.players.find((x) => x.id === playerId);
  if (p) p.ready = ready;
}

function botsReady(room) {
  for (const p of room.players) if (!p.isSelf) p.ready = true;
}

/** Errores (bloquean el inicio) y avisos (no bloquean). */
function validateLobby(room) {
  const issues = [];
  const { hunters, runners, unassigned, target } = teamCounts(room);
  if (unassigned > 0) {
    issues.push({ level: 'error', code: 'unassigned', message: room.settings.assignment === 'auto' ? 'Falta sortear los equipos.' : `Hay ${unassigned} jugador(es) sin equipo.` });
  }
  if (unassigned === 0 && hunters < 1) issues.push({ level: 'error', code: 'no_hunters', message: 'Hace falta al menos 1 cazador.' });
  if (unassigned === 0 && runners < 1) issues.push({ level: 'error', code: 'no_runners', message: 'Hace falta al menos 1 fugitivo.' });
  const notReady = room.players.filter((p) => !p.ready).length;
  if (notReady > 0) issues.push({ level: 'error', code: 'not_ready', message: `${notReady} jugador(es) sin confirmar «listo».` });
  if (unassigned === 0 && hunters >= 1 && runners >= 1 && hunters !== target) {
    issues.push({ level: 'warning', code: 'ratio', message: `La proporción elegida sugiere ${target} cazador(es); hay ${hunters}. (Proporción experimental)` });
  }
  return issues;
}

const canStart = (room) => validateLobby(room).every((i) => i.level !== 'error');

// ------------------------------------------------------------------ partida

function zoneSchedule(settings, random) {
  const r0 = settings.zoneRadiusM;
  const zones = [{ at: 0, center: { x: 0, y: 0 }, r: r0 }];
  if (!settings.dynamicZone) return zones;
  const total = settings.durationMin * 60;
  let prev = zones[0];
  for (const frac of [EXPERIMENTAL.dynamicZone.firstChangeAt, EXPERIMENTAL.dynamicZone.secondChangeAt]) {
    const r = Math.round(prev.r * EXPERIMENTAL.dynamicZone.shrink);
    // Contención: la zona nueva queda dentro de la anterior (recomendación D-032, no regla aprobada).
    const maxShift = prev.r - r;
    const angle = random() * Math.PI * 2;
    const shift = maxShift * (0.3 + random() * 0.6);
    const center = { x: prev.center.x + Math.cos(angle) * shift, y: prev.center.y + Math.sin(angle) * shift };
    // Los cambios se cuentan desde el inicio de la caza (t = ventaja).
    prev = { at: EXPERIMENTAL.headStartS + Math.round(total * frac), center, r };
    zones.push(prev);
  }
  return zones;
}

function zoneAt(game, t) {
  let current = game.zones[0];
  for (const z of game.zones) if (z.at <= t) current = z;
  return current;
}

function nextZoneChange(game, t) {
  // La zona inicial no es un "cambio": durante la cuenta atrás no hay nada que anunciar.
  return game.zones.slice(1).find((z) => z.at > t) ?? null;
}

function randomPointIn(center, radius, random) {
  const a = random() * Math.PI * 2;
  const d = Math.sqrt(random()) * radius;
  return { x: center.x + Math.cos(a) * d, y: center.y + Math.sin(a) * d };
}

function startGame(room) {
  if (!canStart(room)) throw new Error('La sala no está lista');
  const seed = room.seed + room.round * 104729;
  const random = mulberry32(seed);
  const settings = room.settings;
  const zones = zoneSchedule(settings, random);
  const players = room.players.map((p) => {
    // Los cazadores empiezan en el punto de encuentro; los fugitivos, repartidos.
    const pos = p.team === 'hunter' ? randomPointIn({ x: 0, y: 0 }, 25, random) : randomPointIn({ x: 0, y: 0 }, 60, random);
    return {
      id: p.id, name: p.name, isSelf: p.isSelf, team: p.team, status: 'active',
      pos, target: null, lastUpdate: 0, history: [{ t: 0, pos: { ...pos } }],
      outsideSince: null, exposed: false, wanderTarget: null,
    };
  });
  return {
    seed,
    random,
    round: room.round,
    settings,
    zones,
    phase: 'countdown',
    t: -EXPERIMENTAL.countdownS, // segundos de juego; 0 = empieza la ventaja
    headStartS: EXPERIMENTAL.headStartS,
    durationS: settings.durationMin * 60,
    players,
    pings: [],
    nextPingAt: null,
    claims: [],
    captures: [],
    incoming: null,
    scan: { left: EXPERIMENTAL.scan.uses, readyAt: 0, last: null },
    events: [],
    resolutionEndsAt: null,
    outcome: null,
    endedReason: null,
  };
}

const self = (game) => game.players.find((p) => p.isSelf);
const active = (game, team) => game.players.filter((p) => p.team === team && p.status === 'active');
const huntStart = (game) => game.headStartS;
const huntEnd = (game) => game.headStartS + game.durationS;

function emit(game, type, text, extra = {}) {
  game.events.push({ t: game.t, type, text, ...extra });
}

/** Avanza la simulación dtS segundos de juego, en pasos de 1 s (determinista). */
function stepGame(game, dtS) {
  let remaining = dtS;
  while (remaining > 0 && game.phase !== 'finished') {
    const step = Math.min(1, remaining);
    remaining -= step;
    tick(game, step);
  }
  return game;
}

function tick(game, dt) {
  game.t += dt;
  const t = game.t;
  if (game.phase === 'countdown' && t >= 0) {
    game.phase = 'headstart';
    emit(game, 'phase', 'Empieza la ventaja: los fugitivos se esconden.');
  }
  if (game.phase === 'headstart' && t >= huntStart(game)) {
    game.phase = 'hunt';
    game.nextPingAt = huntStart(game) + EXPERIMENTAL.pingEveryS;
    emit(game, 'phase', '¡Empieza la caza!');
  }
  if (game.phase === 'countdown') return;

  moveAll(game, dt);
  if (game.phase === 'hunt' || game.phase === 'resolving') updateZoneState(game);

  if (game.phase === 'hunt') {
    zoneWarnings(game);
    if (game.nextPingAt !== null && t >= game.nextPingAt) doPing(game);
    botCaptures(game);
    processClaims(game);
    processIncoming(game);
    if (active(game, 'runner').length === 0) return finish(game, 'all_captured');
    if (t >= huntEnd(game)) {
      if (game.claims.some(isOpen)) {
        game.phase = 'resolving';
        game.resolutionEndsAt = t + EXPERIMENTAL.resolutionWindowS;
        emit(game, 'resolving', 'Tiempo. Hay disputas abiertas: ventana de resolución.');
      } else {
        return finish(game, 'time_up');
      }
    }
  } else if (game.phase === 'resolving') {
    processClaims(game);
    if (!game.claims.some(isOpen) || t >= game.resolutionEndsAt) {
      for (const c of game.claims) {
        if (isOpen(c)) {
          close(game, c, 'default_no_capture');
          emit(game, 'dispute', `Disputa ${c.hunterName} → ${c.runnerName}: regla predeterminada, no hay captura (propuesta D-035).`);
        }
      }
      return finish(game, active(game, 'runner').length === 0 ? 'all_captured' : 'time_up');
    }
  }
}

function moveAll(game, dt) {
  const t = game.t;
  const zone = zoneAt(game, t);
  const upcoming = nextZoneChange(game, t);
  const assignment = game.phase === 'hunt' ? huntAssignment(game) : null;
  for (const p of game.players) {
    if (p.status !== 'active') continue;
    if (p.isSelf) {
      // Los cazadores esperan en el punto de encuentro durante la ventaja.
      if (p.team === 'hunter' && game.phase === 'headstart') p.target = null;
      if (p.target) p.pos = stepToward(p.pos, p.target, EXPERIMENTAL.walkMps * dt);
      if (p.target && dist(p.pos, p.target) < 0.5) p.target = null;
    } else if (p.team === 'runner') {
      p.pos = stepToward(p.pos, runnerHideSpot(game, p, zone, upcoming), EXPERIMENTAL.botRunnerMps * dt);
    } else if (game.phase === 'hunt') {
      const target = hunterTarget(game, p, zone, assignment);
      p.pos = stepToward(p.pos, target, EXPERIMENTAL.botHunterMps * dt);
    }
    // Muestra "enviada" cada botUpdateEveryS: es lo que ven los demás (también para el jugador).
    if (t - p.lastUpdate >= EXPERIMENTAL.botUpdateEveryS) {
      p.lastUpdate = t;
      p.history.push({ t, pos: { ...p.pos } });
      if (p.history.length > 40) p.history.shift();
    }
  }
}

/**
 * Fugitivo bot: camina hasta un escondite dentro de la zona y se queda quieto. Solo cambia de sitio
 * (caminando y a poca distancia) cuando la zona anunciada deja fuera su escondite o, a veces, cuando
 * una pista acaba de incluir su posición (los fugitivos reciben ese aviso en la app).
 * Solo usa información que un fugitivo conoce: su posición, la zona y los avisos de pista.
 * Nunca la posición de los cazadores. Cada bot tiene su propio generador con semilla, así que su
 * conducta no depende de lo que hagan los demás.
 */
function runnerHideSpot(game, p, zone, upcoming) {
  p.rng ??= mulberry32((game.seed ^ hashCode(p.id)) >>> 0);
  const safe = upcoming && upcoming.at - game.t <= EXPERIMENTAL.dynamicZone.warnS ? upcoming : zone;
  const fits = (spot) => dist(spot, safe.center) <= safe.r * 0.85;
  if (!p.hideSpot || !fits(p.hideSpot)) {
    p.hideSpot = randomPointIn(safe.center, safe.r * 0.8, p.rng);
  }
  const ping = game.pings.at(-1);
  if (ping && ping.n !== p.lastPingSeen) {
    p.lastPingSeen = ping.n;
    if (ping.entries.some((e) => e.id === p.id) && p.rng() < BOT_BEHAVIOR.relocateAfterPingProbability) {
      for (let i = 0; i < 8; i++) {
        const a = p.rng() * Math.PI * 2;
        const d = BOT_BEHAVIOR.relocateMinM + p.rng() * (BOT_BEHAVIOR.relocateMaxM - BOT_BEHAVIOR.relocateMinM);
        const spot = { x: p.pos.x + Math.cos(a) * d, y: p.pos.y + Math.sin(a) * d };
        if (fits(spot)) {
          p.hideSpot = spot;
          break;
        }
      }
    }
  }
  return p.hideSpot;
}

/**
 * Reparto de la búsqueda entre cazadores bot por una convención sencilla: «va quien esté más cerca».
 * Cada bot puede calcular este mismo reparto por su cuenta con lo que su equipo ve en la app:
 * la última pista (posiciones con su antigüedad), los fugitivos expuestos fuera de zona y la posición
 * de sus compañeros cazadores (cada equipo ve a los suyos). No usa la posición real de fugitivos
 * ocultos ni intercambia mensajes. El jugador no entra en el reparto: los bots no presuponen qué hará.
 * Cada fugitivo cuenta una sola vez (si está expuesto, con su posición en directo). Si hay más bots
 * que objetivos, los que sobran van al objetivo más cercano. Desempates fijos: reproducible.
 */
function huntAssignment(game) {
  const ping = game.pings.at(-1);
  const byRunner = new Map();
  const isActive = (id) => game.players.find((p) => p.id === id)?.status === 'active';
  if (ping) for (const e of ping.entries) if (isActive(e.id)) byRunner.set(e.id, e.pos);
  for (const r of active(game, 'runner')) if (r.exposed) byRunner.set(r.id, r.pos);
  const targets = [...byRunner].map(([id, pos]) => ({ id, pos }));
  const bots = active(game, 'hunter').filter((h) => !h.isSelf);
  const assignment = new Map();
  if (targets.length === 0) return assignment;
  const byId = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const pairs = [];
  for (const h of bots) for (const tg of targets) pairs.push({ h, tg, d: dist(h.pos, tg.pos) });
  pairs.sort((a, b) => a.d - b.d || byId(a.h.id, b.h.id) || byId(a.tg.id, b.tg.id));
  const taken = new Set();
  for (const { h, tg } of pairs) {
    if (assignment.has(h.id) || taken.has(tg.id)) continue;
    assignment.set(h.id, tg);
    taken.add(tg.id);
  }
  for (const { h, tg } of pairs) if (!assignment.has(h.id)) assignment.set(h.id, tg);
  return assignment;
}

function hunterTarget(game, hunter, zone, assignment) {
  const target = assignment?.get(hunter.id);
  if (!target) {
    // Sin pistas: patrullan dentro de la zona.
    hunter.chaseId = null;
    if (!hunter.wanderTarget || dist(hunter.pos, hunter.wanderTarget) < 3) hunter.wanderTarget = randomPointIn(zone.center, zone.r * 0.6, game.random);
    return hunter.wanderTarget;
  }
  if (hunter.chaseId !== target.id) {
    hunter.chaseId = target.id;
    hunter.wanderTarget = null;
  }
  // Al llegar a la pista, buscan alrededor con pasos deterministas.
  if (dist(hunter.pos, target.pos) < 10) {
    if (!hunter.wanderTarget || dist(hunter.pos, hunter.wanderTarget) < 3) hunter.wanderTarget = randomPointIn(target.pos, 80, game.random);
    return hunter.wanderTarget;
  }
  return target.pos;
}

function updateZoneState(game) {
  const zone = zoneAt(game, game.t);
  for (const p of game.players) {
    if (p.status !== 'active') continue;
    const outside = dist(p.pos, zone.center) > zone.r;
    if (outside && p.outsideSince === null) {
      p.outsideSince = game.t;
      if (p.isSelf) emit(game, 'zone', 'Estás fuera de la zona. Vuelve con calma: no hace falta correr.');
    } else if (!outside && p.outsideSince !== null) {
      p.outsideSince = null;
      if (p.exposed) emit(game, 'zone', `${p.isSelf ? 'Has vuelto' : `${p.name} ha vuelto`} a la zona.`);
      p.exposed = false;
    }
    if (p.team === 'runner' && p.outsideSince !== null && !p.exposed && game.t - p.outsideSince >= EXPERIMENTAL.outsideGraceS) {
      p.exposed = true;
      emit(game, 'zone', p.isSelf ? `Llevas ${EXPERIMENTAL.outsideGraceS} s fuera: los cazadores te ven.` : `${p.name} lleva ${EXPERIMENTAL.outsideGraceS} s fuera de la zona.`);
    }
  }
}

function zoneWarnings(game) {
  const upcoming = nextZoneChange(game, game.t);
  if (!upcoming) return;
  const warnAt = upcoming.at - EXPERIMENTAL.dynamicZone.warnS;
  if (game.t >= warnAt && !upcoming.warned) {
    upcoming.warned = true;
    emit(game, 'zone', `La zona cambiará en ${formatClock(EXPERIMENTAL.dynamicZone.warnS)}. Muévete con calma hacia la zona marcada.`);
  }
  const previous = game.zones.filter((z) => z.at <= game.t).at(-1);
  if (previous && previous.at > 0 && !previous.announced && game.t >= previous.at) {
    previous.announced = true;
    emit(game, 'zone', 'La zona ha cambiado.');
  }
}

function doPing(game) {
  const entries = active(game, 'runner').map((r) => {
    const last = r.history.at(-1);
    return { id: r.id, name: r.name, pos: { ...last.pos }, measuredAt: last.t };
  });
  game.pings.push({ n: game.pings.length + 1, t: game.t, entries });
  game.nextPingAt = game.t + EXPERIMENTAL.pingEveryS;
  emit(game, 'ping', `Pista #${game.pings.length}: ${entries.length} fugitivo(s) marcados.`);
}

// ------------------------------------------------------------------ capturas (simuladas)

function capture(game, runner, hunter, via) {
  runner.status = 'captured';
  game.captures.push({ runnerId: runner.id, runnerName: runner.name, hunterId: hunter?.id ?? null, hunterName: hunter?.name ?? '—', t: game.t - huntStart(game), via });
  let text;
  if (via === 'autodeclarada') text = runner.isSelf ? 'Has declarado tu captura.' : `${runner.name} declara su captura.`;
  else if (runner.isSelf) text = `${hunter.name} te ha capturado.`;
  else text = `${hunter.isSelf ? 'Has capturado' : `${hunter.name} ha capturado`} a ${runner.name}.`;
  emit(game, 'capture', text);
}

const isOpen = (c) => c.state === 'pending' || c.state === 'disputed';

function close(game, c, state) {
  c.state = state;
  c.closedAt = game.t;
}

/** Tras cerrar una reclamación sin captura, la misma pareja espera antes de reclamar otra vez. */
function inCooldown(game, hunterId, runnerId) {
  return game.claims.some((c) => c.hunterId === hunterId && c.runnerId === runnerId && c.closedAt !== undefined && game.t - c.closedAt < EXPERIMENTAL.reclaimCooldownS);
}

/** D-033: un cazador fuera de la zona no puede capturar. */
const canHunterClaim = (p) => p.team === 'hunter' && p.status === 'active' && p.outsideSince === null;

function botCaptures(game) {
  for (const h of active(game, 'hunter')) {
    if (h.isSelf || !canHunterClaim(h) || game.claims.some((c) => c.hunterId === h.id && isOpen(c))) continue;
    for (const r of active(game, 'runner')) {
      if (dist(h.pos, r.pos) > EXPERIMENTAL.botTagRadiusM) continue;
      if (game.claims.some((c) => c.runnerId === r.id && isOpen(c)) || inCooldown(game, h.id, r.id)) continue;
      if (r.isSelf) {
        if (!game.incoming && !inCooldown(game, h.id, 'me')) {
          game.incoming = { hunterId: h.id, hunterName: h.name, since: game.t };
          emit(game, 'incoming', `${h.name} dice que te ha pillado.`);
        }
      } else {
        game.claims.push({ id: `c${game.claims.length + 1}`, hunterId: h.id, hunterName: h.name, runnerId: r.id, runnerName: r.name, state: 'pending', since: game.t, answerAt: game.t + EXPERIMENTAL.claimResponseS });
      }
      break;
    }
  }
}

function processClaims(game) {
  for (const c of game.claims) {
    const runner = game.players.find((p) => p.id === c.runnerId);
    const hunter = game.players.find((p) => p.id === c.hunterId);
    if (c.state === 'pending' && game.t >= c.answerAt) {
      // Responde un fugitivo simulado (bot).
      if (game.random() < EXPERIMENTAL.botConfirmProbability) {
        close(game, c, 'confirmed');
        capture(game, runner, hunter, 'confirmada');
      } else {
        c.state = 'disputed';
        c.disputedAt = game.t;
        emit(game, 'dispute', `${c.runnerName} disputa ${c.hunterIsSelf ? 'tu reclamación' : `la captura de ${c.hunterName}`}. Queda pendiente.`);
      }
    } else if (c.state === 'disputed' && !c.botDecided && game.t - c.disputedAt >= EXPERIMENTAL.disputeResolveAfterS) {
      // Autoridad = los implicados (propuesta D-035). Un bot solo decide por sí mismo:
      c.botDecided = true;
      const coin = game.random() < 0.5;
      if (c.hunterIsSelf) {
        // El fugitivo bot puede aceptar; si no, decides tú (retirar) o se aplica la regla al final.
        if (coin) {
          close(game, c, 'accepted');
          capture(game, runner, hunter, 'aceptada tras disputa');
        }
      } else if (c.runnerId === 'me') {
        // El cazador bot puede retirar; aceptar la captura solo puedes hacerlo tú.
        if (coin) {
          close(game, c, 'withdrawn');
          emit(game, 'dispute', `${c.hunterName} retira su reclamación sobre ti.`);
        }
      } else if (coin) {
        close(game, c, 'accepted');
        capture(game, runner, hunter, 'aceptada tras disputa');
      } else {
        close(game, c, 'withdrawn');
        emit(game, 'dispute', `${c.hunterName} retira la reclamación sobre ${c.runnerName}.`);
      }
    }
  }
}

function processIncoming(game) {
  if (game.incoming && game.t - game.incoming.since >= EXPERIMENTAL.incomingTimeoutS) {
    const { hunterId, hunterName, since } = game.incoming;
    game.claims.push({ id: `c${game.claims.length + 1}`, hunterId, hunterName, runnerId: 'me', runnerName: 'Tú', state: 'timeout', since, closedAt: game.t });
    emit(game, 'dispute', 'No respondiste a tiempo: no hay captura (regla propuesta).');
    game.incoming = null;
  }
}

/** Fugitivos a los que el jugador (cazador) puede reclamar: proximidad SIMULADA, no validada. */
function claimableRunners(game) {
  const me = self(game);
  if (game.phase !== 'hunt' || !canHunterClaim(me)) return [];
  return active(game, 'runner')
    .filter((r) => dist(me.pos, r.pos) <= EXPERIMENTAL.captureRadiusM)
    .filter((r) => !game.claims.some((c) => c.runnerId === r.id && isOpen(c)) && !inCooldown(game, me.id, r.id));
}

function claimCapture(game, runnerId) {
  const me = self(game);
  if (me.team === 'hunter' && me.outsideSince !== null) return { ok: false, error: 'Estás fuera de la zona: no puedes capturar hasta volver.' };
  const target = claimableRunners(game).find((r) => r.id === runnerId);
  if (!target) return { ok: false, error: 'Ese fugitivo no está lo bastante cerca (proximidad simulada).' };
  if (game.claims.some((c) => c.hunterIsSelf && isOpen(c))) {
    return { ok: false, error: 'Ya tienes una reclamación abierta.' };
  }
  const claim = { id: `c${game.claims.length + 1}`, hunterId: me.id, hunterName: 'Tú', hunterIsSelf: true, runnerId: target.id, runnerName: target.name, state: 'pending', since: game.t, answerAt: game.t + EXPERIMENTAL.claimResponseS };
  game.claims.push(claim);
  emit(game, 'claim', `Reclamación enviada a ${target.name}. Esperando su confirmación.`);
  return { ok: true, claim };
}

function withdrawClaim(game, claimId) {
  const c = game.claims.find((x) => x.id === claimId && x.hunterIsSelf && x.state === 'disputed');
  if (!c) return false;
  close(game, c, 'withdrawn');
  emit(game, 'dispute', `Has retirado la reclamación sobre ${c.runnerName}.`);
  return true;
}

function respondIncoming(game, accept) {
  if (!game.incoming) return false;
  const hunter = game.players.find((p) => p.id === game.incoming.hunterId);
  const me = self(game);
  if (accept) {
    game.claims.push({ id: `c${game.claims.length + 1}`, hunterId: hunter.id, hunterName: hunter.name, runnerId: me.id, runnerName: 'Tú', state: 'confirmed', since: game.t, closedAt: game.t });
    capture(game, me, hunter, 'confirmada');
  } else {
    game.claims.push({ id: `c${game.claims.length + 1}`, hunterId: hunter.id, hunterName: hunter.name, runnerId: me.id, runnerName: 'Tú', state: 'disputed', since: game.t, disputedAt: game.t });
    emit(game, 'dispute', `Has disputado la captura de ${hunter.name}. Sigues en juego; queda pendiente.`);
  }
  game.incoming = null;
  return true;
}

/** El fugitivo acepta una captura que había disputado (autoridad: el propio fugitivo). */
function acceptOwnDispute(game, claimId) {
  const c = game.claims.find((x) => x.id === claimId && x.runnerId === 'me' && x.state === 'disputed');
  if (!c) return false;
  close(game, c, 'accepted');
  capture(game, self(game), game.players.find((p) => p.id === c.hunterId), 'aceptada tras disputa');
  return true;
}

function selfTag(game) {
  const me = self(game);
  if (game.phase !== 'hunt' || me.team !== 'runner' || me.status !== 'active') return false;
  const nearest = active(game, 'hunter').sort((a, b) => dist(me.pos, a.pos) - dist(me.pos, b.pos))[0];
  capture(game, me, nearest ?? null, 'autodeclarada');
  return true;
}

// ------------------------------------------------------------------ guía del siguiente paso

/**
 * Una sola indicación para el jugador, por orden de prioridad: lo que pide respuesta, lo que
 * le impide jugar y, por último, el objetivo normal de su rol. Solo describe el estado: no cambia
 * reglas ni revela nada que el jugador no pueda ver (un fugitivo nunca recibe datos de cazadores).
 * Los textos invitan a moverse con calma (seguridad).
 * tone: 'act' (requiere respuesta) · 'wait' · 'danger' · 'zone' · 'go' · 'info' · 'muted'
 */
function nextStep(game) {
  const me = self(game);
  const t = game.t;
  const isOpen = (c) => c.state === 'pending' || c.state === 'disputed';
  if (game.phase === 'finished') return { tone: 'muted', text: 'Ronda terminada.' };
  if (game.phase === 'countdown') {
    return me.team === 'hunter'
      ? { tone: 'info', text: 'Eres cazador: captura a todos los fugitivos antes de que acabe el tiempo.' }
      : { tone: 'info', text: 'Eres fugitivo: que no te capturen hasta que acabe el tiempo.' };
  }
  if (me.status === 'captured') {
    return { tone: 'muted', text: `Te han capturado. Sigues la partida como espectador (posiciones con ${EXPERIMENTAL.spectatorDelayS} s de retraso).` };
  }
  if (game.incoming) {
    const left = formatClock(EXPERIMENTAL.incomingTimeoutS - (t - game.incoming.since));
    return { tone: 'act', text: `${game.incoming.hunterName} dice que te ha pillado: responde (${left}).` };
  }
  // Fuera de zona es un peligro inmediato: va antes que las reclamaciones que solo esperan.
  if (me.outsideSince !== null) {
    if (me.team === 'hunter') return { tone: 'danger', text: 'Estás fuera de la zona: vuelve con calma para poder capturar.' };
    if (me.exposed) return { tone: 'danger', text: 'Estás fuera de la zona y los cazadores te ven. Vuelve con calma.' };
    const left = formatClock(EXPERIMENTAL.outsideGraceS - (t - me.outsideSince));
    return { tone: 'danger', text: `Estás fuera de la zona: vuelve con calma. Serás visible en ${left}.` };
  }
  const mine = game.claims.find((c) => c.hunterIsSelf && isOpen(c));
  if (mine) {
    return mine.state === 'pending'
      ? { tone: 'wait', text: `Esperando a que ${mine.runnerName} confirme tu captura. Sigue en juego hasta entonces.` }
      : { tone: 'act', text: `${mine.runnerName} disputa tu captura: sigue en juego. Puedes retirarla o esperar a que se resuelva.` };
  }
  const against = game.claims.find((c) => c.runnerId === 'me' && c.state === 'disputed');
  if (against) {
    return { tone: 'act', text: `Disputa abierta con ${against.hunterName}: sigues en juego mientras no se resuelva.` };
  }
  if (game.phase === 'resolving') {
    return { tone: 'danger', text: `Tiempo agotado. Quedan ${formatClock(game.resolutionEndsAt - t)} para resolver las disputas abiertas.` };
  }
  if (game.phase === 'headstart') {
    const left = formatClock(game.headStartS - t);
    return me.team === 'hunter'
      ? { tone: 'wait', text: `Espera en el punto de encuentro. Sales en ${left}.` }
      : { tone: 'go', text: `Aléjate caminando y escóndete dentro de la zona. Los cazadores salen en ${left}.` };
  }
  const upcoming = nextZoneChange(game, t);
  if (upcoming && upcoming.at - t <= EXPERIMENTAL.dynamicZone.warnS) {
    return { tone: 'zone', text: `La zona cambia en ${formatClock(upcoming.at - t)}: ve caminando hacia la zona marcada.` };
  }
  const nextPing = game.nextPingAt !== null ? formatClock(game.nextPingAt - t) : null;
  if (me.team === 'hunter') {
    const reach = claimableRunners(game);
    if (reach.length === 1) return { tone: 'go', text: `${reach[0].name} está a tu alcance: puedes reclamar la captura.` };
    if (reach.length > 1) return { tone: 'go', text: `${reach.length} fugitivos a tu alcance: puedes reclamar una captura.` };
    const ping = game.pings.at(-1);
    if (ping) return { tone: 'info', text: `Busca a partir de la última pista (de hace ${formatClock(t - ping.t)}). Próxima en ${nextPing}.` };
    return { tone: 'info', text: `Patrulla la zona. Primera pista en ${nextPing}.` };
  }
  return { tone: 'info', text: `Sigue escondido dentro de la zona. Próxima pista a los cazadores en ${nextPing}.` };
}

// ------------------------------------------------------------------ rastro propio del fugitivo

/**
 * Qué posición propia recibieron los cazadores en la ÚLTIMA pista, y cuándo. Solo para un
 * fugitivo activo; en cualquier otro caso, null. Devuelve un objeto nuevo con datos propios:
 * nunca entradas de otros jugadores, datos de cazadores ni referencias a la pista interna.
 *   { status: 'none', nextPingIn }                      sin pistas todavía (nextPingIn: s o null)
 *   { status: 'unavailable', pingN, sentAt }            la pista no trae posición propia
 *   { status: 'sent', pingN, sentAt, measuredAt, pos, ageNow, exposedLive }
 * Tiempos en segundos de juego (game.t). ageNow se mide desde la medición, no desde el envío.
 * exposedLive: además, los cazadores le ven en directo por estar fuera de la zona (regla actual).
 */
function ownTrail(game) {
  const me = self(game);
  if (!me || me.team !== 'runner' || me.status !== 'active') return null;
  const ping = game.pings.at(-1);
  if (!ping) {
    // Mismo calendario que tick(): la primera pista llega al empezar la caza + pingEveryS.
    const nextAt = game.nextPingAt ?? huntStart(game) + EXPERIMENTAL.pingEveryS;
    const more = game.phase !== 'resolving' && game.phase !== 'finished' && nextAt < huntEnd(game);
    return { status: 'none', nextPingIn: more ? Math.max(0, nextAt - game.t) : null };
  }
  const entry = ping.entries.find((e) => e.id === me.id);
  if (!entry || !entry.pos) return { status: 'unavailable', pingN: ping.n, sentAt: ping.t };
  return {
    status: 'sent',
    pingN: ping.n,
    sentAt: ping.t,
    measuredAt: entry.measuredAt,
    pos: { x: entry.pos.x, y: entry.pos.y },
    ageNow: game.t - entry.measuredAt,
    exposedLive: me.exposed === true,
  };
}

// ------------------------------------------------------------------ escáner (pista aproximada, D-034)

function scan(game) {
  const me = self(game);
  if (game.phase !== 'hunt') return { ok: false, error: 'El escáner solo funciona durante la caza.' };
  if (me.team !== 'hunter' || me.status !== 'active') return { ok: false, error: 'Solo los cazadores pueden usar el escáner.' };
  if (game.scan.left <= 0) return { ok: false, error: 'No te quedan usos del escáner.' };
  if (game.t < game.scan.readyAt) return { ok: false, error: `Escáner recargando: ${formatClock(game.scan.readyAt - game.t)}.` };
  const count = active(game, 'runner').filter((r) => dist(me.pos, r.pos) <= EXPERIMENTAL.scan.radiusM).length;
  game.scan.left--;
  game.scan.readyAt = game.t + EXPERIMENTAL.scan.cooldownS;
  game.scan.last = { t: game.t, count, at: { ...me.pos } };
  emit(game, 'scan', `Escáner: ${count} fugitivo(s) a menos de ${EXPERIMENTAL.scan.radiusM} m (aproximado).`);
  return { ok: true, count };
}

// ------------------------------------------------------------------ vista del jugador

/** Lo que ve el jugador según las reglas (S0 §6.4): nunca más de lo que le corresponde. */
function visibleFor(game) {
  const me = self(game);
  const out = [];
  if (game.phase === 'countdown') return out;
  if (me.status === 'captured') {
    const asOf = game.t - EXPERIMENTAL.spectatorDelayS;
    for (const p of game.players) {
      if (p.isSelf || p.status !== 'active') continue;
      const h = [...p.history].reverse().find((x) => x.t <= asOf) ?? p.history[0];
      out.push({ id: p.id, name: p.name, team: p.team, pos: h.pos, age: game.t - h.t, kind: 'spectator' });
    }
    return out;
  }
  for (const p of game.players) {
    if (p.isSelf || p.status !== 'active') continue;
    if (p.team === me.team) {
      const last = p.history.at(-1);
      out.push({ id: p.id, name: p.name, team: p.team, pos: last.pos, age: game.t - last.t, kind: 'teammate' });
    } else if (me.team === 'hunter' && game.phase !== 'headstart' && p.exposed) {
      out.push({ id: p.id, name: p.name, team: p.team, pos: p.pos, age: 0, kind: 'exposed' });
    }
  }
  if (me.team === 'hunter') {
    const ping = game.pings.at(-1);
    if (ping) {
      for (const e of ping.entries) {
        if (out.some((o) => o.id === e.id)) continue;
        out.push({ id: e.id, name: e.name, team: 'runner', pos: e.pos, age: game.t - e.measuredAt, kind: 'ping' });
      }
    }
  }
  return out;
}

// ------------------------------------------------------------------ final y rondas

function endGame(game) {
  if (game.phase === 'finished') return;
  finish(game, 'ended_by_host');
}

function finish(game, reason) {
  game.phase = 'finished';
  game.endedReason = reason;
  game.incoming = null;
  const survivors = active(game, 'runner');
  game.outcome = reason === 'ended_by_host'
    ? { winner: null, title: 'Partida terminada por el anfitrión', subtitle: 'Sin ganador.' }
    : survivors.length > 0
      ? { winner: 'runner', title: '¡Ganan los fugitivos!', subtitle: `${survivors.length} superviviente(s) al acabar el tiempo.` }
      : { winner: 'hunter', title: '¡Ganan los cazadores!', subtitle: 'Todos los fugitivos han sido capturados.' };
  emit(game, 'finish', game.outcome.title);
}

function summary(game) {
  return {
    outcome: game.outcome,
    survivors: active(game, 'runner').map((p) => p.name),
    captures: game.captures.map((c) => ({ ...c, clock: formatClock(c.t) })),
    disputes: game.claims.filter((c) => c.disputedAt !== undefined || c.state === 'timeout'),
    hunters: game.players.filter((p) => p.team === 'hunter').map((p) => p.name),
    huntSeconds: Math.max(0, Math.min(game.t, huntEnd(game)) - huntStart(game)),
  };
}

/**
 * Siguiente ronda (D-037): 'redraw' (sorteo nuevo) o 'first_captured' (los primeros capturados
 * empiezan cazando). 'keep' solo vuelve a la sala con los mismos equipos (no es una política de D-037).
 */
function nextRound(room, game, policy) {
  room.round++;
  room.history.push({ round: room.round - 1, outcome: game.outcome?.title, captures: game.captures.length });
  for (const p of room.players) p.ready = p.isSelf ? false : true;
  room.lastPolicy = policy;
  if (policy === 'keep' || room.settings.assignment === 'manual') return room;
  const k = huntersTarget(room.players.length, room.settings.ratio);
  if (policy === 'first_captured' && game.captures.length > 0) {
    const first = game.captures.map((c) => c.runnerId).filter((id, i, all) => all.indexOf(id) === i).slice(0, k);
    const rest = shuffle(room.players.filter((p) => !first.includes(p.id)).map((p) => p.id), mulberry32(room.seed + room.round));
    const hunters = new Set([...first, ...rest.slice(0, k - first.length)]);
    for (const p of room.players) p.team = hunters.has(p.id) ? 'hunter' : 'runner';
    room.lastPolicy = 'first_captured';
  } else {
    drawTeams(room);
    room.lastPolicy = policy === 'first_captured' ? 'redraw_fallback' : 'redraw';
  }
  return room;
}

// ------------------------------------------------------------------ navegación

const ROUTES = ['inicio', 'unirse', 'reglas', 'crear', 'sala', 'partida', 'final'];

function go(route, replace = false) {
  const hash = `#/${route}`;
  if (location.hash === hash) return onRoute();
  if (replace) location.replace(hash);
  else location.hash = hash;
}

function onRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  let route = ROUTES.includes(raw) ? raw : 'inicio';
  const g = state.game;
  // Salir de una partida en curso exige confirmación.
  if (state.route === 'partida' && route !== 'partida' && g && g.phase !== 'finished' && !state.leaving) {
    history.pushState(null, '', '#/partida');
    state.modal = { type: 'leave' };
    return paint();
  }
  state.leaving = false;
  if (route !== state.route) state.modal = null;
  if (route === 'partida' && !g) return go(state.room ? 'sala' : 'inicio', true);
  if (route === 'partida' && g.phase === 'finished') return go('final', true);
  if (route === 'final' && (!g || g.phase !== 'finished')) return go(state.room ? 'sala' : 'inicio', true);
  if (route === 'sala' && !state.room) return go('inicio', true);
  if (route === 'sala' && g && g.phase === 'finished') {
    // Volver atrás desde el final = volver a la sala con los mismos equipos.
    S.nextRound(state.room, g, 'keep');
    state.game = null;
  }
  if (route === 'inicio') {
    // Al volver al inicio se descarta la sala simulada.
    state.room = null;
    state.game = null;
  }
  if (route !== state.route) {
    const box = document.getElementById('toasts');
    if (box) box.innerHTML = '';
  }
  state.route = route;
  document.body.classList.toggle('in-game', route === 'partida');
  paint();
  syncTimers();
}

// ------------------------------------------------------------------ pintado con regiones

const painted = { route: null, regions: new Map(), layer: '' };
const $app = () => document.getElementById('app');
const $layer = () => document.getElementById('layer');

function paint() {
  const html = SCREENS[state.route]();
  const app = $app();
  if (painted.route !== state.route) {
    app.innerHTML = html;
    painted.route = state.route;
    painted.regions.clear();
    for (const el of app.querySelectorAll('[data-region]')) painted.regions.set(el.dataset.region, el.outerHTML);
    window.scrollTo(0, 0);
    const focus = app.querySelector('[data-autofocus]');
    if (focus) focus.focus();
  } else {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    for (const el of tpl.content.querySelectorAll('[data-region]')) {
      const name = el.dataset.region;
      const s = el.outerHTML;
      if (painted.regions.get(name) === s) continue;
      const current = app.querySelector(`[data-region="${name}"]`);
      if (current) current.replaceWith(el);
      painted.regions.set(name, s);
    }
  }
  const layer = renderLayer();
  if (layer !== painted.layer) {
    $layer().innerHTML = layer;
    painted.layer = layer;
    const focus = $layer().querySelector('[data-autofocus]');
    if (focus) focus.focus();
  }
  if (state.route === 'partida') {
    paintMarkers();
    // Los avisos breves se colocan bajo el HUD (banners incluidos) cuando el panel está abierto.
    const hud = document.querySelector('.hud');
    if (hud) document.body.style.setProperty('--toast-top', `${Math.round(hud.getBoundingClientRect().bottom + 8)}px`);
  }
  document.body.classList.toggle('sheet-open', state.route === 'partida' && state.sheetOpen);
  applyBinds();
}

/** Textos que cambian cada segundo: se actualizan sin sustituir botones (evita toques perdidos). */
function applyBinds() {
  const values = state.route === 'partida' && state.game ? gameBinds(state.game) : {};
  for (const el of document.querySelectorAll('[data-bind]')) {
    const v = values[el.dataset.bind];
    if (v !== undefined && el.textContent !== v) el.textContent = v;
  }
  for (const el of document.querySelectorAll('[data-bindw]')) {
    const v = values[el.dataset.bindw];
    if (v !== undefined) el.style.width = v;
  }
  for (const el of document.querySelectorAll('[data-age]')) {
    const v = state.game ? ago(state.game.t - Number(el.dataset.age)) : '';
    if (el.textContent !== v) el.textContent = v;
  }
}

// ------------------------------------------------------------------ avisos breves

function toast(text, kind = 'info') {
  const box = document.getElementById('toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<span class="ico" aria-hidden="true"></span><span>${esc(text)}</span>`;
  box.appendChild(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => el.remove(), 3400);
}
